<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng các cá doi con! 🎉</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            padding: 0 20px;
        }
        .input-group {
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 12px 20px;
            font-size: 1.2rem;
            border: 2px solid #ff4757;
            border-radius: 25px;
            outline: none;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="text"]:focus {
            border-color: #2ed573;
        }
        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            width: 100%;
            justify-content: center;
        }
        button {
            font-size: 1.2rem;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #btn-yes {
            background-color: #2ed573;
            color: white;
            z-index: 2;
        }
        #btn-no {
            background-color: #a4b0be;
            color: white;
            position: absolute;
            z-index: 1;
        }
        #success-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #success-container img {
            border-radius: 20px;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="question">Các cá doi con đã sẵn sàng gánh team bằng Git chưa? 😎</h1>
        
        <div class="input-group">
            <input type="text" id="student-name" placeholder="Nhập tên của cá doi con..." autocomplete="off">
        </div>

        <div class="buttons" id="btn-group">
            <button id="btn-yes" onclick="sayYes()">Sẵn sàng!</button>
            <button id="btn-no" onmouseover="runAway()">Bỏ cuộc</button>
        </div>
    </div>

    <div id="success-container">
        <h1 id="greeting-message">Tuyệt vời!</h1>
        <img src="https://media.tenor.com/Z4c9rD3K-1QAAAAi/cat-typing.gif" alt="Coding Cat">
    </div>

    <script>
        const btnNo = document.getElementById("btn-no");
        btnNo.style.left = "60%";

        function runAway() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const randomX = Math.random() * (windowWidth - 150);
            const randomY = Math.random() * (windowHeight - 50);
            
            btnNo.style.position = "fixed";
            btnNo.style.left = randomX + "px";
            btnNo.style.top = randomY + "px";
        }

        function sayYes() {
            let name = document.getElementById("student-name").value.trim();
            
            if (name === "") {
                name = "cá doi con";
            }

            document.getElementById("greeting-message").innerHTML = `Tuyệt vời, <b>${name}</b>! <br> Chúc em code ít bug nhé! 🚀💖`;

            document.getElementById("game-container").style.display = "none";
            document.getElementById("success-container").style.display = "flex";
        }
    </script>
</body>
</html>
